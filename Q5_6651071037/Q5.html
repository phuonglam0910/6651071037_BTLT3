<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Trang đăng ký tài khoản ShopVN">

    <title>ShopVN - Đăng ký tài khoản</title>

    <link rel="stylesheet" href="dangky.css">
</head>

<body>

    <main>

        <section class="container">

            <h1>Đăng ký tài khoản mới</h1>

            <form
                action="xu_ly_dangky.php"
                method="POST"
                enctype="multipart/form-data"
                name="formDangKy"
                id="formDangKy">

                <!-- FIELDSET 1 -->
                <fieldset>

                    <legend>
                        Thông tin cơ bản
                    </legend>

                    <!-- HỌ TÊN -->
                    <div class="form-row">

                        <label for="hoten">
                            Họ và tên:
                        </label>

                        <input
                            type="text"
                            name="hoten"
                            id="hoten"
                            placeholder="Nguyễn Văn An"
                            required
                            maxlength="100">

                    </div>

                    <!-- EMAIL -->
                    <div class="form-row">

                        <label for="email">
                            Email:
                        </label>

                        <input
                            type="email"
                            name="email"
                            id="email"
                            placeholder="example@gmail.com"
                            required>

                    </div>

                    <!-- MẬT KHẨU -->
                    <div class="form-row">

                        <label for="matkhau">
                            Mật khẩu:
                        </label>

                        <input
                            type="password"
                            name="matkhau"
                            id="matkhau"
                            minlength="8"
                            required>

                    </div>

                    <!-- SỐ ĐIỆN THOẠI -->
                    <div class="form-row">

                        <label for="sdt">
                            Số điện thoại:
                        </label>

                        <input
                            type="tel"
                            name="sdt"
                            id="sdt"
                            pattern="[0-9]{10}"
                            placeholder="0901234567">

                    </div>

                </fieldset>

                <!-- FIELDSET 2 -->
                <fieldset>

                    <legend>
                        Thông tin cá nhân
                    </legend>

                    <!-- TUỔI -->
                    <div class="form-row">

                        <label for="tuoi">
                            Tuổi:
                        </label>

                        <input
                            type="number"
                            name="tuoi"
                            id="tuoi"
                            min="16"
                            max="99"
                            step="1"
                            value="18">

                    </div>

                    <!-- NGÀY SINH -->
                    <div class="form-row">

                        <label for="ngaysinh">
                            Ngày sinh:
                        </label>

                        <input
                            type="date"
                            name="ngaysinh"
                            id="ngaysinh"
                            min="1950-01-01"
                            max="2010-12-31">

                    </div>

                    <!-- GIỚI TÍNH -->
                    <div class="form-row">

                        <label>
                            Giới tính:
                        </label>

                        <div class="radio-group">

                            <label>
                                <input
                                    type="radio"
                                    name="gioitinh"
                                    value="nam">
                                Nam
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="gioitinh"
                                    value="nu">
                                Nữ
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="gioitinh"
                                    value="khac">
                                Khác
                            </label>

                        </div>

                    </div>

                    <!-- MÀU YÊU THÍCH -->
                    <div class="form-row">

                        <label for="mauua">
                            Màu yêu thích:
                        </label>

                        <input
                            type="color"
                            name="mauua"
                            id="mauua"
                            value="#FF6B6B">

                    </div>

                </fieldset>

                <!-- FIELDSET 3 -->
                <fieldset>

                    <legend>
                        Sở thích &amp; Cài đặt
                    </legend>

                    <!-- TÌM KIẾM SỞ THÍCH -->
                    <div class="form-row">

                        <label for="soikim">
                            Tìm kiếm sở thích:
                        </label>

                        <input
                            type="search"
                            name="soikim"
                            id="soikim"
                            placeholder="Ví dụ: đọc sách, chơi game...">

                    </div>

                    <!-- MỨC CHI TIÊU -->
                    <div class="form-row">

                        <label for="chitieu">
                            Mức chi tiêu/tháng:
                        </label>

                        <input
                            type="range"
                            name="chitieu"
                            id="chitieu"
                            min="0"
                            max="50000000"
                            step="500000"
                            value="5000000">

                    </div>

                    <!-- SỞ THÍCH -->
                    <div class="form-row">

                        <label>
                            Sở thích:
                        </label>

                        <div class="checkbox-group">

                            <label>
                                <input
                                    type="checkbox"
                                    name="st_docsinh"
                                    value="doc">
                                Đọc sách
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    name="st_game"
                                    value="game">
                                Chơi game
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    name="st_du_lich"
                                    value="dulich">
                                Du lịch
                            </label>

                        </div>

                    </div>

                    <!-- WEBSITE -->
                    <div class="form-row">

                        <label for="website">
                            Website cá nhân:
                        </label>

                        <input
                            type="url"
                            name="website"
                            id="website"
                            placeholder="https://example.com">

                    </div>

                    <!-- ẢNH ĐẠI DIỆN -->
                    <div class="form-row">

                        <label for="avatar">
                            Ảnh đại diện:
                        </label>

                        <input
                            type="file"
                            name="avatar"
                            id="avatar"
                            accept="image/png,image/jpeg">

                    </div>

                </fieldset>

                <!-- NÚT -->
                <div class="buttons">

                    <input
                        type="submit"
                        value="Đăng ký ngay">

                    <input
                        type="reset"
                        value="Nhập lại">

                </div>

            </form>

        </section>

    </main>

</body>
</html>
